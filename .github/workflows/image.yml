name: Image

# Builds and pushes a multi-arch (amd64 + arm64) image, unlike upstream's
# published 0.3.3 tag which is amd64-only (Dockerfile hardcoded
# GOARCH=amd64) -- that broke on this cluster's arm64 (Oracle Ampere A1)
# node with "exec format error". A push here is the only "build" step
# needed; ArgoCD/kubectl pick up new content on the next rollout restart.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/image.yml'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build and push (ghcr.io)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        run: |
          REPO=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA="${{ github.sha }}"
          echo "tags=ghcr.io/${REPO}/sealed-secrets-ui:latest,ghcr.io/${REPO}/sealed-secrets-ui:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### sealed-secrets-ui image published (linux/amd64, linux/arm64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tags |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`sealed-secrets-ui\` | \`latest\`, \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "First run: make the package public on GHCR (Settings ->" >> $GITHUB_STEP_SUMMARY
          echo "Package settings -> Change visibility), or add an" >> $GITHUB_STEP_SUMMARY
          echo "imagePullSecret to apps/sealed-secrets-ui/ in jessups-gitops if" >> $GITHUB_STEP_SUMMARY
          echo "it should stay private." >> $GITHUB_STEP_SUMMARY
